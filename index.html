<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Peer-to-peer audio and video calling with PeerJS and WebRTC">
  <title>PeerCall</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>PeerCall</h1>
        <p>โทรเสียงและวิดีโอแบบ Peer-to-Peer</p>
      </div>
      <span id="status" class="status status-loading">กำลังเชื่อมต่อ</span>
    </header>

    <section class="card identity-card">
      <div class="label-row">
        <span>Peer ID ของคุณ</span>
        <button id="copyIdBtn" class="text-btn" type="button" disabled>คัดลอก</button>
      </div>
      <div class="id-box" id="myId">กำลังสร้าง ID…</div>
      <button id="shareIdBtn" class="secondary-btn" type="button" disabled>แชร์ ID ให้เพื่อน</button>
    </section>

    <section class="card call-card">
      <label for="remoteId">Peer ID ของคนที่ต้องการโทร</label>
      <input id="remoteId" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="วาง Peer ID ที่นี่">

      <div class="mode-grid">
        <button class="mode-btn active" data-mode="video" type="button">
          <span>วิดีโอ</span>
          <small>กล้อง + ไมค์</small>
        </button>
        <button class="mode-btn" data-mode="audio" type="button">
          <span>เสียง</span>
          <small>ไมค์อย่างเดียว</small>
        </button>
      </div>

      <button id="callBtn" class="primary-btn" type="button" disabled>โทรออก</button>
    </section>

    <section id="incomingCard" class="card incoming-card hidden" aria-live="polite">
      <div>
        <strong id="incomingTitle">มีสายเรียกเข้า</strong>
        <p id="incomingText">มีคนกำลังโทรหาคุณ</p>
      </div>
      <div class="incoming-actions">
        <button id="rejectBtn" class="danger-btn" type="button">ปฏิเสธ</button>
        <button id="acceptBtn" class="accept-btn" type="button">รับสาย</button>
      </div>
    </section>

    <section class="card media-card">
      <div class="media-header">
        <div>
          <span class="eyebrow">การสนทนา</span>
          <h2 id="callState">ยังไม่ได้โทร</h2>
        </div>
        <span id="timer" class="timer">00:00</span>
      </div>

      <div class="video-area">
        <div id="remotePane" class="remote-pane empty">
          <video id="remoteVideo" autoplay playsinline></video>
          <audio id="remoteAudio" autoplay></audio>
          <div id="remotePlaceholder" class="media-placeholder">ยังไม่มีสายสนทนา</div>
          <span id="remoteLabel" class="media-label">ปลายทาง</span>
        </div>
        <div id="localPane" class="local-pane hidden">
          <video id="localVideo" autoplay muted playsinline></video>
          <span class="media-label">คุณ</span>
        </div>
      </div>

      <div class="controls">
        <button id="micBtn" class="control-btn" type="button" disabled>ปิดไมค์</button>
        <button id="cameraBtn" class="control-btn" type="button" disabled>ปิดกล้อง</button>
        <button id="hangupBtn" class="hangup-btn" type="button" disabled>วางสาย</button>
      </div>
    </section>

    <section class="card log-card">
      <div class="label-row">
        <span>สถานะระบบ</span>
        <button id="clearLogBtn" class="text-btn" type="button">ล้าง</button>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
    </section>

    <footer>
      <p>ทำงานบน HTTPS เช่น Vercel · ใช้ PeerJS Cloud สำหรับ signaling</p>
    </footer>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
